# Tek başına sunucu: Destek Merkezi + Caddy (otomatik Let's Encrypt HTTPS).
# Önce deploy/Caddyfile içindeki alan adını kendi adresinizle değiştirin.
#   cd deploy && docker compose -f docker-compose.tek.yml up -d --build
# Proje adı açık (aynı klasördeki başka compose dosyalarıyla karışmasın); birim adları eski kurulumla aynı.
name: destek
services:
  destek:
    init: true  # PID 1 olarak tini: alt süreçleri toplar (zombie birikmez), sinyalleri düzgün iletir
    build: ..
    env_file: ../.env
    volumes:
      - destek-data:/data
    restart: unless-stopped
    # Sertleştirme (Kasım 2026 güvenlik taraması): kök dosya sistemi salt okunur, yazma yalnız /data ve /tmp'de;
    # Linux yetkileri kapalı, yetki yükseltme yok; bellek, süreç ve kayıt boyutu sınırlı.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    depends_on: [destek]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  destek-data:
    name: deploy_destek-data
  caddy-data:
    name: deploy_caddy-data
  caddy-config:
    name: deploy_caddy-config
